name: Koosta Ajalootunni RSS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-rss.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Koosta ja kontrolli RSS
        run: |
          python3 - <<'PY'
          import json, datetime, email.utils, xml.etree.ElementTree as E
          from urllib.request import Request, urlopen
          from urllib.parse import urlsplit, urlencode
          API='https://arhiiv.err.ee/api/v1'
          def read(url, method='GET'):
              parts=urlsplit(url)
              data=parts.query.encode() if method=='POST' else None
              target=url.split('?')[0] if method=='POST' else url
              with urlopen(Request(target,data=data,method=method,headers={'Accept':'application/json','Content-Type':'application/x-www-form-urlencoded','User-Agent':'Ajalootund RSS feed'}),timeout=60) as r:
                  return json.load(r)
          items={}
          for p in (1,2):
              page=read(f'{API}/series/audio/ajalootund-r2-s?limit=500&page={p}&all=false','POST')
              for i in page['activeList']['data']:
                  items[i['url']]=i
          assert len(items)==670, f'Expected 670 episodes, got {len(items)}'
          root=E.Element('rss',version='2.0')
          channel=E.SubElement(root,'channel')
          def add(parent,key,value):
              E.SubElement(parent,key).text=value
          add(channel,'title','Ajalootund R2-s')
          add(channel,'link','https://arhiiv.err.ee/audio/seeria/ajalootund-r2-s')
          add(channel,'description','Hillar Palametsa Ajalootund R2-s. Helifailid ERR-i arhiivist.')
          add(channel,'language','et')
          for slug,i in items.items():
              item=E.SubElement(channel,'item')
              add(item,'title',i['heading'])
              add(item,'description',i.get('lead',''))
              add(item,'link','https://arhiiv.err.ee/audio/vaata/'+slug)
              E.SubElement(item,'guid',isPermaLink='false').text='err-'+str(i['fileId'])
              date=datetime.datetime.fromisoformat(i['uploadDate'].replace('Z','+00:00'))
              add(item,'pubDate',email.utils.format_datetime(date))
              E.SubElement(item,'enclosure',url=API+'/audioDownload/'+slug,length='0',type='audio/mpeg')
          E.indent(root)
          E.ElementTree(root).write('ajalootund-r2-s.xml',encoding='utf-8',xml_declaration=True)
          assert len(E.parse('ajalootund-r2-s.xml').findall('./channel/item'))==670
          print('VERIFIED: 670 unique episodes')
          for slug in list(items)[::334]:
              try:
                  with urlopen(Request(API+'/audioDownload/'+slug,headers={'Range':'bytes=0-1023'}),timeout=30) as r:
                      data=r.read(1024)
                      print('AUDIO CHECK',r.status,r.headers.get('Content-Type'),r.geturl(),len(data),data[:16].hex())
              except Exception as ex:
                  print('AUDIO CHECK FAILED',str(ex))
          PY
      - name: Salvesta RSS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ajalootund-r2-s.xml
          git diff --cached --quiet || git commit -m 'Paranda RSS: kõik 670 saadet'
          git push
