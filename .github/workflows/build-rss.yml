name: Koosta Ajalootunni RSS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Koosta RSS-fail
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from email.utils import format_datetime
          from html import escape
          import json
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          API='https://arhiiv.err.ee/api/v1'
          SERIES='https://arhiiv.err.ee/audio/seeria/ajalootund-r2-s?limit=500'
          def get_json(url, method='GET'):
              with urlopen(Request(url, method=method, headers={'Accept':'application/json','User-Agent':'Ajalootund RSS feed'}), timeout=60) as r: return json.load(r)
          pages=[get_json(f'{API}/series/audio/ajalootund-r2-s?limit=500&page={p}&all=false','POST') for p in (1,2)]
          seen=set(); items=[]
          for page in pages:
              for item in page['activeList']['data']:
                  if item.get('url') and item['url'] not in seen: seen.add(item['url']); items.append(item)
          def stream(item):
              media=get_json(f"{API}/content/audio/{quote(item['url'],safe='')}").get('mainContent',{}).get('medias',[])
              hls=media[0].get('src',{}).get('hls','') if media else ''
              return 'https:'+hls if hls.startswith('//') else hls
          with ThreadPoolExecutor(max_workers=3) as pool: streams=list(pool.map(stream,items))
          episodes=sorted(((item,url) for item,url in zip(items,streams) if url),key=lambda pair:pair[0].get('uploadDate',''),reverse=True)
          lines=['<?xml version="1.0" encoding="UTF-8"?>','<rss version="2.0" xmlns:itunes="http://www.itunes.com/dtds/podcast-1.0.dtd" xmlns:podcast="https://podcastindex.org/namespace/1.0"><channel>','<title>Ajalootund R2-s</title>',f'<link>{SERIES}</link>','<description>ERRi arhiivis avaldatud Ajalootund R2-s saated. Helid voogedastatakse otse ERRi arhiivist.</description>','<language>et</language><itunes:author>ERR / Hillar Palamets</itunes:author><itunes:explicit>false</itunes:explicit>']
          for item,url in episodes:
              try: date=format_datetime(datetime.fromisoformat(item['uploadDate'].replace('Z','+00:00')).astimezone(timezone.utc))
              except: date=''
              lines.append(f'<item><title>{escape(item.get("heading",""))}</title><description>{escape(item.get("lead",""))}</description><guid isPermaLink="false">err-arhiiv-{item.get("fileId",item["url"])}</guid><link>https://arhiiv.err.ee/audio/vaata/{escape(item["url"])}</link><pubDate>{date}</pubDate><enclosure url="{escape(url)}" length="0" type="application/x-mpegURL"/><podcast:alternateEnclosure type="application/x-mpegURL"><podcast:source uri="{escape(url)}" type="application/x-mpegURL"/></podcast:alternateEnclosure></item>')
          Path('ajalootund-r2-s.xml').write_text('\n'.join(lines+['</channel></rss>']),encoding='utf-8')
          print('Episodes:',len(episodes))
          PY
      - name: Salvesta RSS-fail
        run: |
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ajalootund-r2-s.xml
          git diff --cached --quiet || (git commit -m 'Lisa Ajalootunni RSS' && git push)
